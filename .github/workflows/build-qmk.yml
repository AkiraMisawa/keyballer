# Reusable workflow that builds the QMK firmware described by a config
# repository's keyballer.json and publishes it on its `firmware` branch,
# where the Keyballer app reads it.
#
# In the config repository:
#
#   jobs:
#     build:
#       uses: AkiraMisawa/keyballer/.github/workflows/build-qmk.yml@main
#       permissions:
#         contents: write
#         checks: write
#
# Publishing runs only for the default branch. It records the SHA-256 of every
# published file as a `keyballer-firmware` check run on the source commit, and
# Keyballer flashes only bytes that match it (src/lib/provenance.ts). A user's
# token can rewrite the firmware branch but cannot create check runs.

name: Build QMK firmware

on:
  workflow_call:
    inputs:
      keyballer_ref:
        description: Ref of AkiraMisawa/keyballer that provides the build scripts. Keep it equal to the ref in `uses:`.
        type: string
        default: main

jobs:
  plan:
    name: Read keyballer.json
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AkiraMisawa/keyballer
          ref: ${{ inputs.keyballer_ref }}
          path: keyballer
      - id: plan
        run: |
          echo "ids=$(python3 keyballer/scripts/build_qmk.py config --list)" >> "$GITHUB_OUTPUT"
          echo "image=$(python3 keyballer/scripts/build_qmk.py config --image)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ${{ needs.plan.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AkiraMisawa/keyballer
          ref: ${{ inputs.keyballer_ref }}
          path: keyballer
      - name: Build
        env:
          WORK_DIR: ${{ runner.temp }}/keyballer-work
        run: python3 keyballer/scripts/build_qmk.py config out --only "${{ matrix.id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.id }}
          path: out/
          if-no-files-found: error

  publish:
    name: Publish to the firmware branch
    needs: [plan, build]
    # Only the default branch publishes: a pushed side branch never replaces the firmware.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AkiraMisawa/keyballer
          ref: ${{ inputs.keyballer_ref }}
          path: keyballer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          merge-multiple: true
          path: out
      - name: Write manifest.json
        run: python3 keyballer/scripts/make_manifest.py out '${{ needs.plan.outputs.ids }}'
      - name: List the digests of the published files
        working-directory: out
        run: |
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > ../digests.txt
          cat ../digests.txt
      - name: Push the firmware branch
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b firmware
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Firmware for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:firmware
      - name: Record the digests as a check run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=keyballer-firmware \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Firmware digests' \
            -f 'output[summary]=SHA-256 of each file published on the firmware branch. Keyballer flashes only files that match.' \
            -F 'output[text]=@digests.txt' > /dev/null
